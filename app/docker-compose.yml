# Produção (Coolify): Losambo + WAHA + PostgreSQL na mesma stack.
# - Só o serviço "losambo" precisa de domínio (ex.: https://message.beeznoo.ao).
# - O WAHA fica na rede interna: a Losambo fala com http://waha:3000 e o WAHA chama http://losambo:4000.
# - O PostgreSQL guarda a Losambo (base "losambo") e as sessões WhatsApp do WAHA (bases "waha_…").
# Defina as variáveis ${…} no Coolify (Environment Variables).
# POSTGRES_PASSWORD e WAHA_DB_PASSWORD: só letras e números (o WAHA não descodifica caracteres especiais no URL).
# O WAHA usa o utilizador "waha" (criado no 1.º arranque por docker/postgres-init), sem acesso à base "losambo".

services:
  losambo:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      # --- Servidor ---
      PORT: "4000"
      TRUST_PROXY: "1"
      PUBLIC_API_URL: ${PUBLIC_URL:?}/v1
      SESSION_DAYS: ${SESSION_DAYS:-14}
      ALLOW_PRIVATE_URLS: "false"
      # --- Base de dados (PostgreSQL da stack) ---
      DATABASE_URL: postgres://losambo:${POSTGRES_PASSWORD:?}@postgres:5432/losambo
      DATABASE_SSL: "false"
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      # --- Segredos ---
      LOSAMBO_SECRET_KEY: ${LOSAMBO_SECRET_KEY:?}
      # --- WAHA (rede interna) ---
      WAHA_URL: http://waha:3000
      WAHA_USE_CUSTOM_API_KEY: "true"
      WAHA_API_KEY: ${WAHA_API_KEY:?}
      WAHA_WEBHOOK_BASE: http://losambo:4000
      WAHA_WEBHOOK_TOKEN: ${WAHA_WEBHOOK_TOKEN:?}
      # --- OTP ---
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-300}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      # --- Tipos de conta (planos). Limites: número, ou "ilimitado". ---
      PLAN_FREE_LABEL: ${PLAN_FREE_LABEL:-Grátis}
      PLAN_FREE_MONTHLY_MESSAGES: ${PLAN_FREE_MONTHLY_MESSAGES:-100}
      PLAN_FREE_ALLOW_OWN_NUMBERS: ${PLAN_FREE_ALLOW_OWN_NUMBERS:-false}
      PLAN_FREE_MAX_OWN_NUMBERS: ${PLAN_FREE_MAX_OWN_NUMBERS:-0}
      PLAN_STARTUP_LABEL: ${PLAN_STARTUP_LABEL:-Startup}
      PLAN_STARTUP_MONTHLY_MESSAGES: ${PLAN_STARTUP_MONTHLY_MESSAGES:-5000}
      PLAN_STARTUP_ALLOW_OWN_NUMBERS: ${PLAN_STARTUP_ALLOW_OWN_NUMBERS:-false}
      PLAN_STARTUP_MAX_OWN_NUMBERS: ${PLAN_STARTUP_MAX_OWN_NUMBERS:-0}
      PLAN_BUSINESS_LABEL: ${PLAN_BUSINESS_LABEL:-Negócio}
      PLAN_BUSINESS_MONTHLY_MESSAGES: ${PLAN_BUSINESS_MONTHLY_MESSAGES:-ilimitado}
      PLAN_BUSINESS_ALLOW_OWN_NUMBERS: ${PLAN_BUSINESS_ALLOW_OWN_NUMBERS:-true}
      PLAN_BUSINESS_MAX_OWN_NUMBERS: ${PLAN_BUSINESS_MAX_OWN_NUMBERS:-ilimitado}
      PLAN_INTERNAL_LABEL: ${PLAN_INTERNAL_LABEL:-Interno}
      # --- E-mail (Resend) e contas internas ---
      PUBLIC_URL: ${PUBLIC_URL:?}
      RESEND_API_KEY: ${RESEND_API_KEY:?}
      EMAIL_FROM: ${EMAIL_FROM:-Losambo <no-reply@message.beeznoo.ao>}
      EMAIL_VERIFY_TTL_HOURS: ${EMAIL_VERIFY_TTL_HOURS:-24}
      INTERNAL_EMAIL_DOMAINS: ${INTERNAL_EMAIL_DOMAINS:-beeznoo.ao}
      # --- Entrar com WhatsApp ---
      WHATSAPP_AUTH_SESSION: ${WHATSAPP_AUTH_SESSION:-}
      WHATSAPP_AUTH_RESEND_SECONDS: ${WHATSAPP_AUTH_RESEND_SECONDS:-60}
      WHATSAPP_AUTH_MAX_PER_PHONE_HOUR: ${WHATSAPP_AUTH_MAX_PER_PHONE_HOUR:-5}
      WHATSAPP_AUTH_MAX_PER_IP_HOUR: ${WHATSAPP_AUTH_MAX_PER_IP_HOUR:-20}
      # --- Entrar com Google (opcional: vazio = botão escondido) ---
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${PUBLIC_URL:?}/auth/google/callback
    depends_on:
      postgres:
        condition: service_healthy
      waha:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  waha:
    # Fixe uma versão testada em WAHA_IMAGE (ex.: devlikeapro/waha:<versão>) para atualizações controladas.
    image: ${WAHA_IMAGE:-devlikeapro/waha:latest}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:?}
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WHATSAPP_SESSIONS_POSTGRESQL_URL: postgres://waha:${WAHA_DB_PASSWORD:?}@postgres:5432/postgres?sslmode=disable
      WAHA_PRINT_QR: "false"
      # Persistência: sessões, ligações WhatsApp e chaves ficam no PostgreSQL (volume postgres-data);
      # depois de reinícios/redeploys o WAHA volta a ligar sozinho todas as sessões guardadas.
      WAHA_WORKER_ID: losambo-waha
      WHATSAPP_RESTART_ALL_SESSIONS: "true"
      WAHA_LOG_FORMAT: JSON
      WAHA_LOG_LEVEL: ${WAHA_LOG_LEVEL:-info}
      WAHA_AUTO_START_DELAY_SECONDS: ${WAHA_AUTO_START_DELAY_SECONDS:-2}
      TZ: ${TZ:-Africa/Luanda}
      # Só a Losambo fala com o WAHA (rede interna): sem painel nem Swagger.
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_SWAGGER_ENABLED: "false"
    volumes:
      - waha-media:/app/.media
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: losambo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: losambo
      WAHA_DB_PASSWORD: ${WAHA_DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U losambo -d losambo"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

# Volumes nomeados: sobrevivem a reinícios, redeploys e atualizações de imagem.
# (No Coolify só se perdem se apagar o recurso com "delete volumes".)
volumes:
  postgres-data:
  waha-media:
