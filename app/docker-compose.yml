services:
  postgres:
    image: postgres:16-alpine
    container_name: losambo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: losambo
      POSTGRES_PASSWORD: losambo
      POSTGRES_DB: losambo
    ports:
      - "5433:5432"
    volumes:
      - losambo-pg:/var/lib/postgresql/data

volumes:
  losambo-pg:
